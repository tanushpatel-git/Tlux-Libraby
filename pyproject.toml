[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlux_lazy"
version = "0.1.0"
description = "Automatically compare ML models with different preprocessing and scaling techniques."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Tanush Patel", email = "tanush000patel@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "numpy>=1.23",
    "joblib>=1.2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/tanushpatel/Tlux"
Repository = "https://github.com/tanushpatel/Tlux"
Issues = "https://github.com/tanushpatel/Tlux/issues"

[tool.setuptools.packages.find]
include = ["tlux*"]
